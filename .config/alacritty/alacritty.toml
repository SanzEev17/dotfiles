[window]
padding.x = 10
padding.y = 10
startup_mode = "Maximized"
decorations = "none"
opacity = 0.9
blur = true

[env]
TERM = "xterm-256color"

[font]
normal.family = "Cascadia Code NF"
size = 15

[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Beam", blinking = "On" } 
